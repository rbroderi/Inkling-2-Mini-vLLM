[project]
name = "inkling-qlora"
version = "0.2.0"
description = "QLoRA training and vLLM serving of Inkling-2-Mini on one 24 GB Ampere GPU (RTX 3090)"
readme = "README.md"
requires-python = ">=3.14"  # the code relies on deferred annotations (PEP 649)
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "beartype>=0.23.1",  # runtime type checks for the package (see inkling_qlora/__init__.py)
    "torch",
    "safetensors",
]

[project.optional-dependencies]
train = ["transformers", "peft>=0.22", "trl>=1.18", "accelerate", "bitsandbytes", "datasets", "triton"]
test = ["pytest", "pytest-timeout"]

[tool.setuptools]
packages = ["inkling_qlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
    "SIM905",
    "SIM103",
    "RUF005",
    "RUF007",
    # The modules are shared with a project linted with select = ["ALL"]; its noqa codes are kept.
    "RUF100",
]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["inkling_qlora", "gpu_checks"]
known-third-party = ["datasets"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"gpu_checks/*" = ["E501", "E402"]
"scripts/*" = ["E501", "E741", "SIM118", "F841"]
