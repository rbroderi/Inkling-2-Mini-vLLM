[project]
name = "inkling-qlora"
version = "0.1.0"
description = "QLoRA training and vLLM serving of Inkling-2-Mini on one 24 GB Ampere GPU (RTX 3090)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch", "safetensors"]

[project.optional-dependencies]
train = ["transformers", "peft>=0.22", "trl>=1.18", "accelerate", "bitsandbytes", "datasets", "triton"]
test = ["pytest"]

[tool.setuptools]
packages = ["inkling_qlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "SIM905", "SIM103", "RUF005", "RUF007"]

[tool.ruff.lint.isort]
known-first-party = ["inkling_qlora", "gpu_checks"]
known-third-party = ["datasets"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"gpu_checks/*" = ["E501", "E402"]
"scripts/*" = ["E501", "E741", "SIM118", "F841"]
